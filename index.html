<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061b34">
  <title>Sürüş Asistanı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span>DRIVE ASSIST</span>
    <span><i class="gps-dot"></i> TEST</span>
  </header>

  <main class="gauge-area">
    <svg id="gauge" viewBox="0 0 600 430" role="img" aria-label="Hız göstergesi">
      <path id="gaugeFace" class="gauge-face"></path>
      <path id="gaugeArc" class="gauge-arc"></path>
      <g id="ticks"></g>
      <g id="labels"></g>

      <!-- Kısa Toyota tarzı ibre: merkezden başlamaz -->
      <line id="needle" class="needle"></line>

      <text id="digitalSpeed" class="digital-speed" x="300" y="210">0</text>
      <text class="digital-unit" x="300" y="240">km/h</text>
    </svg>
  </main>

  <section class="container-fluid info-row">
    <div class="info-card">
      <div id="trip" class="info-number">0.00</div>
      <div class="info-unit">km</div>
      <div class="info-label">MESAFE</div>
    </div>
    <div class="info-card">
      <div id="altitude" class="info-number">0</div>
      <div class="info-unit">m</div>
      <div class="info-label">RAKIM</div>
    </div>
  </section>

  <section class="test-panel">
    <label for="speedSlider">HIZ TESTİ</label>
    <input id="speedSlider" class="form-range" type="range" min="0" max="240" value="0">
    <div id="testValue">0 km/h</div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
